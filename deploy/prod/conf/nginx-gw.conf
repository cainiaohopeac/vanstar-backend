# 生产环境接入层网关配置(部署到 192.168.0.171 的 /usr/local/nginx/conf/conf.d/gw.conf)
# 说明: 静态资源交给本机前端容器 bzpt-web(内部 8089), 接口负载到后端实例
# 注意: upstream 中列出的端口必须在安全组对内网放行, 否则请求会挂起(nginx 记为 499)

# 仅当客户端发起 upgrade 时才转发 upgrade 头(普通请求带 Connection: upgrade 会被后端误判为协议升级)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream bzpt_backend {
    least_conn;
    server 192.168.0.32:8081  max_fails=3 fail_timeout=30s;
    server 192.168.0.32:8082  max_fails=3 fail_timeout=30s;
    server 192.168.0.211:8081 max_fails=3 fail_timeout=30s;
    server 192.168.0.211:8082 max_fails=3 fail_timeout=30s;
}

# SSE 推送: SseEmitter 存在实例本地内存, 必须做会话保持, 否则推送会丢失
upstream bzpt_sse {
    ip_hash;
    server 192.168.0.32:8081  max_fails=3 fail_timeout=30s;
    server 192.168.0.32:8082  max_fails=3 fail_timeout=30s;
    server 192.168.0.211:8081 max_fails=3 fail_timeout=30s;
    server 192.168.0.211:8082 max_fails=3 fail_timeout=30s;
}

server {
    # 对外端口(安全组需放行 8088; 前端容器改到内部 8089, 避免 host 网络端口冲突)
    listen 8088;
    server_name _;

    # 对齐后端 max-http-post-size=1GB / 分片 5MB
    client_max_body_size 1024m;
    client_body_timeout  300s;
    server_tokens off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------- 前端静态资源(本机前端容器 8089) ----------
    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---------- SSE 精确匹配(优先级高于 /prod-api/) ----------
    location = /prod-api/resource/sse {
        proxy_pass http://bzpt_sse;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ---------- 后端接口 ----------
    location /prod-api/ {
        proxy_pass http://bzpt_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # 普通接口超时不宜过长, 实例异常时让 nginx 尽快判定失败并摘除(配合 max_fails)
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout;
    }

    # ---------- 文件/图片回源(后端从 MinIO 流式返回) ----------
    # proxy_pass 不带 URI: 保留原始 /uploads/** 路径(后端 FileAccessController 映射 /uploads/**),
    # 若写成 http://bzpt_backend/ 则 location 匹配到的 /uploads/ 会被替换掉, 后端无路由 -> 404
    location /uploads/ {
        proxy_pass http://bzpt_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    # ---------- 监控端点禁止外网访问 ----------
    location ~ ^(/[^/]*)?/actuator.* {
        return 403;
    }
}
