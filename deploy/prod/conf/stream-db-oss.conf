# 生产环境四层转发配置(部署到 192.168.0.171 的 /usr/local/nginx/conf/stream.d/db-oss.conf)
# 用途: 内网机无公网 IP, 通过接入层公网 IP 映射 MySQL 与 MinIO 供外部管理/访问
#
# 安全建议(务必处理其一):
#   1) 云安全组只放行可信来源 IP 访问 3306 / 9000 / 9001, 不要对 0.0.0.0/0 开放
#   2) 或在下面的 server 块中加 IP 白名单:
#        allow 1.2.3.4;    # 办公网出口 IP
#        deny  all;
# 注意: 流量经 171 中转, 会占用 50Mbps 公网带宽; 大对象传输建议走内网或后续绑定独立公网 IP

# MySQL: 公网 3306 -> 192.168.0.223:3306
server {
    listen 3306;
    proxy_connect_timeout 5s;
    proxy_timeout 3600s;
    proxy_pass 192.168.0.223:3306;
}

# MinIO API: 公网 9000 -> 192.168.0.162:9000
server {
    listen 9000;
    proxy_connect_timeout 5s;
    proxy_timeout 3600s;
    proxy_pass 192.168.0.162:9000;
}

# MinIO 控制台: 公网 9001 -> 192.168.0.162:9001
server {
    listen 9001;
    proxy_connect_timeout 5s;
    proxy_timeout 3600s;
    proxy_pass 192.168.0.162:9001;
}
